name: verify-integrated-candidate

# Runs only when the isolated, byte-pinned smoke harness changes.
# A draft candidate release is transport, NOT a production release.
on:
  push:
    branches:
      - codex/phase12-quest-foundation
    paths:
      - .github/workflows/verify-integrated-candidate.yml
      - scripts/ci/candidate-portable-smoke.mjs
      - scripts/ci/prepare-integrated-candidate-smoke.mjs
      - scripts/ci/candidate-stage-d-smoke.mjs
      - scripts/ci/candidate-visual-render-smoke.mjs
      - scripts/ci/candidate-bridge-mcp-smoke.mjs
      - scripts/ci/candidate-cold-relaunch-smoke.mjs
      - apps/desktop/e2e/phase10-file-picker.spec.ts
      - apps/desktop/e2e/phase11-session.spec.ts
      - apps/desktop/e2e/phase15-curvature-native.spec.ts
      - apps/desktop/e2e/phase15-interference-native.spec.ts
      - apps/desktop/e2e/sketch-workspace.spec.ts

permissions:
  # GitHub drafts are restricted to principals with repository write access.
  # Never use this token in the application under test.
  contents: write
  actions: read

jobs:
  exact-packaged-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CANDIDATE_TAG: kreoda-candidate-20261114-9d11ef5
      EXPECTED_HEAD: 9d11ef58c7cd5af97cd7b580f40aaf98f002ff38
      EXPECTED_BUNDLE_SHA256: 036CFF37ED0B5850926224CB0AFC75A159A558897D77FFC1F74E314BCCF85B1D
      EXPECTED_RECEIPT_SHA256: B7520DCDDB43E98EB82F147BEEC8F22279678E3E39C000CBA70A1FBD887F8F7A
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Candidate product bytes were built from a previous commit; the
          # ancestry/diff guard requires that commit, not a depth-1 clone.
          fetch-depth: 0

      - name: Verify exact source and truly isolated runner
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Fail closed: no isolated GitHub-hosted runner' }
          $head = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $env:EXPECTED_HEAD $head
          if ($LASTEXITCODE -ne 0) { throw "Original candidate source is not an ancestor: $head" }
          # Exact packaged product code and its ZIP must be IDENTICAL to the original.
          # Only harness and unshipped test specs may differ from its source commit.
          $allowed = @('.github/workflows/verify-integrated-candidate.yml', 'scripts/ci/candidate-portable-smoke.mjs', 'scripts/ci/prepare-integrated-candidate-smoke.mjs', 'scripts/ci/candidate-stage-d-smoke.mjs', 'scripts/ci/candidate-visual-render-smoke.mjs', 'scripts/ci/candidate-bridge-mcp-smoke.mjs', 'scripts/ci/candidate-cold-relaunch-smoke.mjs', 'apps/desktop/e2e/phase10-file-picker.spec.ts', 'apps/desktop/e2e/phase11-session.spec.ts', 'apps/desktop/e2e/phase15-curvature-native.spec.ts', 'apps/desktop/e2e/phase15-interference-native.spec.ts', 'apps/desktop/e2e/sketch-workspace.spec.ts')
          $delta = @(git diff --name-only $env:EXPECTED_HEAD $head)
          if ($LASTEXITCODE -ne 0 -or @($delta | Where-Object { $_ -notin $allowed }).Count -ne 0) {
            throw 'Product source changed since the exact compiled candidate; rebuild needed'
          }
          if (Get-Process -Name Kreoda,kreoda-core -ErrorAction SilentlyContinue) { throw 'Existing candidate process on runner' }
          if (Get-Process -Id 8616 -ErrorAction SilentlyContinue) { throw 'Unverified foreign owner PID 8616 on runner' }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install only smoke-driver dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact candidate from PRIVATE DRAFT release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $all = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases with authenticated read' }
          $matching = @($all | Where-Object { $_.tag_name -eq $env:CANDIDATE_TAG -and $_.draft -eq $true -and $_.prerelease -eq $true })
          if ($matching.Count -ne 1) { throw 'Exact unpublished draft candidate missing or ambiguous' }
          $release = $matching[0]
          if ($release.target_commitish -ne $env:EXPECTED_HEAD) { throw 'Draft release does not target pinned source' }
          $assets = @(
            @{ name = 'Kreoda-Desktop-Bridge-Quest-bundle-20261114.zip'; sha = $env:EXPECTED_BUNDLE_SHA256; size = 409742645 },
            @{ name = 'Kreoda-Desktop-Bridge-Quest-bundle-20261114-verification.json'; sha = $env:EXPECTED_RECEIPT_SHA256; size = 60271 }
          )
          $dest = Join-Path $env:GITHUB_WORKSPACE 'candidate-input'
          New-Item -ItemType Directory -Path $dest | Out-Null
          foreach ($expected in $assets) {
            $asset = @($release.assets | Where-Object { $_.name -eq $expected.name })
            if ($asset.Count -ne 1 -or $asset[0].size -ne $expected.size) { throw "Draft asset missing/size differs: $($expected.name)" }
            $file = Join-Path $dest $expected.name
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset[0].id)"
            & curl.exe --fail --silent --show-error --location --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' --header "Authorization: Bearer $env:GH_TOKEN" --output $file $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $file)) { throw "Draft download failed: $($expected.name)" }
            if ((Get-Item -LiteralPath $file).Length -ne $expected.size -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected.sha) {
              throw "Downloaded bytes do not match exact original: $($expected.name)"
            }
          }
          'Pinned unpublished candidate assets downloaded and authenticated.'

      - name: Extract original package bytes without rewriting them
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'candidate-input/Kreoda-Desktop-Bridge-Quest-bundle-20261114.zip'
          $dest = Join-Path $env:GITHUB_WORKSPACE '.artifacts/kreoda-integrated-package-20261113/output'
          if (Test-Path -LiteralPath $dest) { throw 'Unexpected pre-existing candidate extraction directory' }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest

      - name: Verify every extracted file and adapt only ephemeral host paths
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'candidate-input/Kreoda-Desktop-Bridge-Quest-bundle-20261114.zip'
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'candidate-input/Kreoda-Desktop-Bridge-Quest-bundle-20261114-verification.json'
          node scripts/ci/prepare-integrated-candidate-smoke.mjs $zip $receipt
          if ($LASTEXITCODE -ne 0) { throw 'Extracted original bytes/staging verification failed' }

      - name: Verify previous exact-package 7-of-7 hosted smoke without repeating it
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/43532379181" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
              $run.head_sha -ne 'e580fb76e655d86a0236096c0d229b99d7c116d2') {
            throw 'Original packaged runtime smoke is not a successful pinned GitHub job'
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'prior-packaged-smoke-proof'
          gh run download 43532379181 --repo $env:GITHUB_REPOSITORY --name 'candidate-exact-portable-smoke-43532379181' --dir $dest
          if ($LASTEXITCODE -ne 0) { throw 'Original packaged acceptance receipt cannot be retrieved' }
          $files = @(Get-ChildItem -LiteralPath $dest -Filter smoke.json -File -Recurse)
          if ($files.Count -ne 1 -or (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash -ne
              '4181D5A47E56C38F8C6FFA2E48C9615B6388A571378BE696B55575C5ADD09BCB') {
            throw 'Original smoke receipt hash or identity changed'
          }
          $proof = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PASS_PACKAGED_REAL_OCCT_BRIDGE_HIDDEN' -or
              $proof.releaseId -ne '0.1.0-integrated-20261113-c211b2e01fb7-f003945f69bd-476eccda' -or
              $proof.exeSha256 -ne 'a09ee422ccf2c678db1b41ed3d2dbbcf987be1585e0a7cdbbc858321778a35b4' -or
              $proof.coreSha256 -ne 'f003945f69bdf04e7ab66ea1319b50e22723b5e716047e8dbb2f4e21dc3710b4' -or
              @($proof.tests).Count -ne 7 -or @($proof.tests | Where-Object { -not $_.pass }).Count -ne 0) {
            throw 'Original packaged functional acceptance receipt has not proved seven actual checks'
          }
          'Existing seven original packaged native smoke checks ACCEPTED by immutable receipt; not repeated.'

      - name: Build real Release Stage D .NET acceptance probe
        shell: pwsh
        run: |
          dotnet build clients/session-dotnet/probes/Kreoda.McpProbe/Kreoda.McpProbe.csproj -c Release --nologo -p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { throw 'Canonical native-reference-reconstruction probe build failed' }
          $probe = Join-Path $env:GITHUB_WORKSPACE 'clients/session-dotnet/probes/Kreoda.McpProbe/bin/Release/net8.0/Kreoda.McpProbe.dll'
          if (-not (Test-Path -LiteralPath $probe)) { throw 'Release probe missing' }
          'STAGE_D_PROBE_SHA256='+ (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash

      - name: REAL packaged CAD Stage D calibrated sketch, ICAD and Undo
        id: stage-d
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          KREODA_HERMES_CONFIG: ''
          KREODA_CAD_SESSION_URL: ''
          KREODA_CAD_PAIR: ''
          KREODA_VOICE_TOKEN: ''
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'clients/session-dotnet/probes/Kreoda.McpProbe/bin/Release/net8.0/Kreoda.McpProbe.dll'
          $sha = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash
          node scripts/ci/candidate-stage-d-smoke.mjs "--probe-sha256=$sha" '--prime-stage-d-grant=PRIME_APPROVED_GITHUB_HOSTED_STAGE_D'
          if ($LASTEXITCODE -ne 0) { throw 'Original packaged Stage D CAD acceptance failed' }

      - name: REAL packaged WebGL viewport pixel proof
        id: visual
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          KREODA_HERMES_CONFIG: ''
          KREODA_CAD_SESSION_URL: ''
          KREODA_CAD_PAIR: ''
          KREODA_VOICE_TOKEN: ''
        run: |
          node scripts/ci/candidate-visual-render-smoke.mjs '--prime-visual-grant=PRIME_APPROVED_GITHUB_HOSTED_VISUAL'
          if ($LASTEXITCODE -ne 0) { throw 'Original packaged WebGL raster acceptance failed' }

      - name: REAL packaged Desktop to HermesBridge authenticated HTTP MCP and Undo
        id: bridge-mcp
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          KREODA_HERMES_CONFIG: ''
          KREODA_CAD_SESSION_URL: ''
          KREODA_CAD_PAIR: ''
          KREODA_VOICE_TOKEN: ''
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'clients/session-dotnet/probes/Kreoda.McpProbe/bin/Release/net8.0/Kreoda.McpProbe.dll'
          $sha = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash
          node scripts/ci/candidate-bridge-mcp-smoke.mjs "--probe-sha256=$sha" '--prime-bridge-mcp-grant=PRIME_APPROVED_GITHUB_HOSTED_BRIDGE_MCP'
          if ($LASTEXITCODE -ne 0) { throw 'Original packaged authenticated HTTP MCP CAD acceptance failed' }

      - name: REAL packaged cold restart and ICAD persistence across Electron processes
        id: cold-relaunch
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          KREODA_HERMES_CONFIG: ''
          KREODA_CAD_SESSION_URL: ''
          KREODA_CAD_PAIR: ''
          KREODA_VOICE_TOKEN: ''
        run: |
          node scripts/ci/candidate-cold-relaunch-smoke.mjs '--prime-cold-relaunch-grant=PRIME_APPROVED_GITHUB_HOSTED_COLD_RELAUNCH'
          if ($LASTEXITCODE -ne 0) { throw 'Original packaged cold restart + ICAD recovery failed' }

      - name: Build targeted CI Electron shell against original native OCCT bytes
        id: targeted-shell-build
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          $releaseId = '0.1.0-integrated-20261113-c211b2e01fb7-f003945f69bd-476eccda'
          $core = Join-Path $env:GITHUB_WORKSPACE ".artifacts/kreoda-integrated-package-20261113/output/$releaseId/Kreoda-win32-x64/resources/kreoda-core.exe"
          $dest = Join-Path $env:GITHUB_WORKSPACE 'native/kreoda-core/build/Release/kreoda-core.exe'
          if ((Get-FileHash -LiteralPath $core -Algorithm SHA256).Hash -ne 'F003945F69BDF04E7AB66EA1319B50E22723B5E716047E8DBB2F4E21DC3710B4') {
            throw 'Native dev E2E source does not match the shipped original OCCT core'
          }
          if (Test-Path -LiteralPath $dest) { throw 'Unexpected native dev core would alter provenance' }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
          Copy-Item -LiteralPath $core -Destination $dest
          if ((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash -ne 'F003945F69BDF04E7AB66EA1319B50E22723B5E716047E8DBB2F4E21DC3710B4') {
            throw 'Real native test core bytes changed after staging'
          }
          pnpm --filter @kreoda/desktop build
          if ($LASTEXITCODE -ne 0) { throw 'Targeted original-product E2E JavaScript build failed' }

      - name: Recheck ONLY 5 original CI failing E2E flows with genuine OCCT
        id: targeted-e2e
        if: steps.targeted-shell-build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 14
        shell: pwsh
        env:
          KREODA_HERMES_CONFIG: ''
          KREODA_VOICE_TOKEN: ''
        run: |
          # phase11-session.spec.ts contains two already-passing tests. Limit
          # this verification to the five exact failures in native CI 43528252383.
          $onlyFailures = 'native file pickers: Save/Open cancellation|unified session: saved document, paired client|native curvature reaches the real GPU|real OCCT interference is shared read-only|sketch workspace: disclosure'
          pnpm --filter @kreoda/desktop exec playwright test e2e/phase10-file-picker.spec.ts e2e/phase11-session.spec.ts e2e/phase15-curvature-native.spec.ts e2e/phase15-interference-native.spec.ts e2e/sketch-workspace.spec.ts --grep $onlyFailures --reporter=list
          if ($LASTEXITCODE -ne 0) { throw 'Targeted actual OCCT / Electron E2E regressions still fail' }

      - name: REQUIRE all new packaged functional gates
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.stage-d.outcome }}' -ne 'success' -or
              '${{ steps.visual.outcome }}' -ne 'success' -or
              '${{ steps.bridge-mcp.outcome }}' -ne 'success' -or
              '${{ steps.cold-relaunch.outcome }}' -ne 'success' -or
              '${{ steps.targeted-shell-build.outcome }}' -ne 'success' -or
              '${{ steps.targeted-e2e.outcome }}' -ne 'success') {
            throw "New functional checks did not ALL PASS (stageD=${{ steps.stage-d.outcome }}, visual=${{ steps.visual.outcome }}, httpMcp=${{ steps.bridge-mcp.outcome }}, cold=${{ steps.cold-relaunch.outcome }}, targetedBuild=${{ steps.targeted-shell-build.outcome }}, targetedE2E=${{ steps.targeted-e2e.outcome }})"
          }

      - name: Retain exact smoke results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-exact-portable-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .artifacts/kreoda-integrated-package-20261113/smoke/**/smoke.json
            .artifacts/kreoda-integrated-package-20261113/smoke/**/electron-stderr.log
            .artifacts/kreoda-integrated-package-20261113/smoke/**/bridge-stderr.log
            .artifacts/kreoda-integrated-package-20261113/hosted-smoke-manifest.json
            .artifacts/kreoda-integrated-package-20261113/stage-d-smoke/**/receipt.json
            .artifacts/kreoda-integrated-package-20261113/bridge-mcp-smoke/**/receipt.json
            .artifacts/kreoda-integrated-package-20261113/cold-relaunch-smoke/**/receipt.json
            .artifacts/kreoda-integrated-acceptance-20261114/cold-relaunch-smoke/**/receipt.json
            .artifacts/kreoda-integrated-acceptance-20261114/visual-smoke/**/receipt.json
            .artifacts/kreoda-integrated-acceptance-20261114/visual-smoke/**/*.png
            prior-packaged-smoke-proof/**/smoke.json
            apps/desktop/test-results/**/trace.zip
            apps/desktop/test-results/**/error-context.md
            apps/desktop/e2e/**/curvature-sphere.png
